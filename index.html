<!doctype html>
<html lang="ar" dir="rtl">

<title>الكتاب — قراءة وبحث</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>

    </select>
  </div>
  <div id="status"></div>
</header>
<main id="pages"></main>
<div id="noResults" class="no-results">لا توجد صفحات مطابقة للبحث.</div>
<script src="book-data.js"></script>
